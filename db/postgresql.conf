# Minimal PG config tuned for a desktop/analytics workload with
# occasional bulk imports. Adjust to your machine; these values
# assume ~16GB RAM available to the host. Reduce if your machine
# is smaller.

listen_addresses = '*'
max_connections = 50

# Memory
shared_buffers = 1GB
effective_cache_size = 4GB
work_mem = 64MB
maintenance_work_mem = 512MB

# WAL / checkpoint — relaxed for analytics, less safe for OLTP
wal_level = replica
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
synchronous_commit = off

# Planner
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Parallelism
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4

# Logging — quiet by default
log_min_duration_statement = 1000
log_line_prefix = '%t [%p] %u@%d '

# Timezone
timezone = 'UTC'
